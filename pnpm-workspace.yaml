packages:
  - 'apps/*'
  - 'packages/*'

# esbuild and protobufjs need their install scripts to link native binaries; vitest and
# testcontainers do not work without them. ssh2 and cpu-features only build optional
# native crypto used when talking to a Docker daemon over SSH, they need a full MSVC
# toolchain on Windows, and ssh2 falls back to pure JS - so both stay off. msw ships a
# postinstall that only writes a service-worker file when the consuming package.json sets
# `msw.workerDirectory`; apps/web does not set it, and node-side `setupServer` needs no
# worker at all - so the script has nothing to do here, and is denied rather than merely
# permitted-and-inert.
allowBuilds:
  esbuild: true
  protobufjs: true
  ssh2: false
  cpu-features: false
  msw: false
